name: Update KRA Music

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Apple Music releases
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://itunes.apple.com/lookup?id=1840257401&entity=album&country=JP&limit=200"
          req = urllib.request.Request(url, headers={"User-Agent": "KRA-Website/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          releases = []
          for item in data.get("results", []):
              if item.get("wrapperType") != "collection":
                  continue
              if item.get("artistId") != 1840257401:
                  continue
              releases.append({
                  "title": item.get("collectionName", ""),
                  "date": item.get("releaseDate", ""),
                  "artwork": item.get("artworkUrl100", "").replace("100x100bb", "600x600bb"),
                  "appleMusic": item.get("collectionViewUrl", ""),
                  "spotify": "https://open.spotify.com/artist/28Hs76wopYVWdrb0jjIg3c"
              })

          releases.sort(key=lambda item: item["date"], reverse=True)
          if not releases:
              raise RuntimeError("No KRA releases found; existing data was not changed")

          with open("music.json", "w", encoding="utf-8") as f:
              json.dump(releases, f, ensure_ascii=False, indent=2)
          PY

      - name: Save updated music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KRA music"
            git push
          fi
